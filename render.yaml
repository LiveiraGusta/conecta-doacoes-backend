# Blueprint do Render (https://render.com/docs/blueprint-spec).
# Os segredos ficam com sync: false e são preenchidos no painel na primeira criação.
services:
  - type: web
    name: conecta-doacoes-api
    runtime: node
    plan: free
    region: oregon
    # NODE_ENV=production também vale no build: sem --include=dev o tsup não é instalado.
    buildCommand: npm ci --include=dev && npm run build
    # Aplica as migrações pendentes e sobe a API.
    startCommand: npm run start:prod
    # Só recebe tráfego quando o banco responde.
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: SWAGGER_ENABLED
        value: "false"
      - key: LOG_LEVEL
        value: info
      - key: JWT_EXPIRES_IN
        value: 7d
      # Cookie de sessão só por HTTPS. A API não sobe em produção sem isso (src/core/env.ts).
      - key: COOKIE_SECURE
        value: "true"
      - key: DATABASE_URL # pooler do Supabase, porta 6543
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET # openssl rand -base64 48
        sync: false
      # Front em domínio próprio, no mesmo site da API (ADR-13): ex.: https://app.seudominio.com.br
      # *.vercel.app e *.onrender.com são recusados: o cookie de sessão não funciona entre eles.
      - key: CORS_ORIGIN
        sync: false
      # Opcional: ex.: .seudominio.com.br. Vazio = cookie só no host da API (já funciona com app.<dom> + api.<dom>).
      - key: COOKIE_DOMAIN
        sync: false
      - key: RESEND_API_KEY # recuperação de senha; obrigatória em produção
        sync: false
      - key: EMAIL_FROM # remetente de um domínio verificado no Resend
        sync: false
      - key: APP_URL # frontend (https://app.seudominio.com.br); link do e-mail de redefinição; precisa estar no CORS_ORIGIN
        sync: false
