openapi: 3.1.0
info:
  title: Conecta Doações API
  version: 1.0.0
  description: |
    API do MVP Conecta Doações (V1.0). Contrato consolidado dos 4 módulos (Autenticação & Moderação, Vitrine & Doações,
    Match Invertido, Chat, Encerramento & Denúncias), do Perfil e do Health check.

    Versionamento: rotas de negócio em /api/v1; /health e /docs ficam fora da versão.

    Convenções: JSON em snake_case, datas ISO 8601 em UTC, IDs UUID, erros no formato
    `{ error, message, details? }`. Paginação com `limit` (1–50, default 30) e `offset`.

    Sessão (ADR-13): login e cadastros gravam o cookie httpOnly `cd_session` (SameSite=Lax, Path=/api/v1,
    7 dias). O navegador o envia sozinho; o cliente usa `credentials: 'include'`. O header
    `Authorization: Bearer` não é aceito. `POST /auth/logout` apaga o cookie.

    Anti-CSRF: toda requisição POST, PUT, PATCH ou DELETE precisa do header `X-Requested-With: XMLHttpRequest`,
    inclusive as rotas públicas de /auth. Sem ele: `403 CSRF_HEADER_MISSING`. Nas rotas logadas,
    a sessão é conferida antes: sem cookie válido a resposta é 401.
servers:
  - url: http://localhost:3333/api/v1
    description: Local
  - url: https://<api>/api/v1
    description: Produção
security:
  - cookieAuth: []
tags:
  - name: Auth
    description: Módulo 1 — Autenticação
  - name: Admin
    description: Módulo 1 — Moderação de ONGs
  - name: Items
    description: Módulo 2 — Vitrine & Doações
  - name: Interests
    description: Módulo 3 — Match Invertido
  - name: Chats
    description: |
      Módulo 4 — Chat & Encerramento. Em tempo real: WebSocket em /api/v1/chats/ws, autenticado pelo cookie
      de sessão no handshake (protocolo em "Spec do Chat em Tempo Real — WebSocket.md"); as rotas REST abaixo
      continuam valendo.
  - name: Reports
    description: |
      Módulo 4 — Denúncias. Dois tipos: de negociação (`CHAT`, a outra parte) e de anúncio (`ITEM`, conteúdo
      impróprio: nudez, ódio, violência, golpe, item proibido, spam). Com 3 pessoas diferentes com denúncia de
      anúncio aberta, o anúncio sai do ar sozinho (`moderation_status: OCULTO`) até o Admin removê-lo ou mantê-lo.
  - name: Profile
    description: Perfil do usuário logado
  - name: Users
    description: Página pessoal de doadores e ONGs (logado)
  - name: Public
    description: |
      Visitante sem login. DTOs próprios, com `additionalProperties: false`: nunca trazem nome, foto,
      banner, endereço, contato, observações do item nem contagem de interessadas. Rate limit por IP.
  - name: Health
    description: Liveness e readiness (fora de /api/v1)

paths:
  # ───────────────────────── Módulo 1 — Autenticação & Moderação ─────────────────────────
  /auth/register/donor:
    post:
      tags: [Auth]
      summary: Cadastrar doador
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, city, state]
              properties:
                name: { type: string, minLength: 2, maxLength: 255 }
                email: { type: string, format: email }
                password: { type: string, minLength: 8, maxLength: 72, description: 'Ao menos 1 letra e 1 número' }
                city: { type: string, minLength: 2, maxLength: 100 }
                state: { $ref: '#/components/schemas/UF' }
      responses:
        '201':
          description: Doador criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409':
          description: EMAIL_TAKEN
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '403': { $ref: '#/components/responses/CsrfHeaderMissing' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/register/ngo:
    post:
      tags: [Auth]
      summary: Cadastrar ONG (nasce PENDENTE_APROVACAO)
      security: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name, email, password, city, state, cnpj, document]
              properties:
                name: { type: string, minLength: 2, maxLength: 255 }
                email: { type: string, format: email }
                password: { type: string, minLength: 8, maxLength: 72 }
                city: { type: string, minLength: 2, maxLength: 100 }
                state: { $ref: '#/components/schemas/UF' }
                cnpj: { type: string, description: '14 dígitos, com ou sem máscara; dígitos verificadores válidos' }
                website: { type: string, format: uri, maxLength: 255 }
                document: { type: string, format: binary, description: 'PDF, JPG, PNG ou WEBP até 5 MB' }
            encoding:
              document: { contentType: 'application/pdf, image/jpeg, image/png, image/webp' }
      responses:
        '201':
          description: ONG criada, aguardando aprovação
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400':
          description: INVALID_DOCUMENT ou VALIDATION_ERROR
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409':
          description: EMAIL_TAKEN ou CNPJ_TAKEN
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '403': { $ref: '#/components/responses/CsrfHeaderMissing' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/login:
    post:
      tags: [Auth]
      summary: Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 1 }
      responses:
        '200':
          description: Autenticado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401':
          description: INVALID_CREDENTIALS
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '403': { $ref: '#/components/responses/CsrfHeaderMissing' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/me:
    get:
      tags: [Auth]
      summary: Usuário do token, lido do banco
      responses:
        '200':
          description: Usuário atual
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Sair (apaga o cookie de sessão)
      description: |
        Pública e idempotente: responde 204 com ou sem sessão. Com o cookie httpOnly, só o servidor
        consegue apagá-lo; o `Set-Cookie` repete os mesmos atributos do login, com validade expirada.
      security: []
      responses:
        '204': { description: Sessão encerrada }
        '403': { $ref: '#/components/responses/CsrfHeaderMissing' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/password/forgot:
    post:
      tags: [Auth]
      summary: Pedir link de redefinição de senha (V1.1)
      description: |
        Sempre responde 202, exista ou não uma conta com o e-mail, para não revelar quem está cadastrado.
        Se a conta existe, envia um e-mail com o link `APP_URL/redefinir-senha?token=…`, válido por 30 minutos
        e de uso único. Pedir um link novo invalida os anteriores; pedidos repetidos em menos de 60 s não geram
        outro e-mail.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '202': { description: Pedido recebido }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/CsrfHeaderMissing' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/password/reset:
    post:
      tags: [Auth]
      summary: Definir nova senha com o token do e-mail (V1.1)
      description: Consome o token e encerra todas as sessões abertas (tokens JWT emitidos antes deixam de valer).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password]
              properties:
                token: { type: string, minLength: 1, maxLength: 200 }
                new_password: { type: string, minLength: 8, maxLength: 72, description: 'Ao menos 1 letra e 1 número' }
      responses:
        '204': { description: Senha redefinida }
        '400':
          description: INVALID_RESET_TOKEN (inválido, expirado ou já usado) ou VALIDATION_ERROR
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '403': { $ref: '#/components/responses/CsrfHeaderMissing' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /admin/ngos:
    get:
      tags: [Admin]
      summary: Listar ONGs para moderação (ADMIN)
      parameters:
        - { name: status, in: query, schema: { allOf: [{ $ref: '#/components/schemas/NgoStatus' }], default: PENDENTE_APROVACAO } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: ONGs, mais antigas primeiro
          content:
            application/json:
              schema:
                type: object
                required: [total, data]
                properties:
                  total: { type: integer, minimum: 0 }
                  data: { type: array, items: { $ref: '#/components/schemas/AdminNgo' } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/ngos/{ngoProfileId}/status:
    parameters:
      - { name: ngoProfileId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [Admin]
      summary: Aprovar ou rejeitar ONG (ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [ATIVO, REJEITADO] }
                rejection_reason: { type: string, minLength: 10, maxLength: 1000, description: 'Obrigatório se REJEITADO' }
      responses:
        '200':
          description: Status atualizado
          content:
            application/json:
              schema:
                type: object
                required: [id, status, rejection_reason]
                properties:
                  id: { type: string, format: uuid }
                  status: { type: string, enum: [ATIVO, REJEITADO] }
                  rejection_reason: { type: [string, 'null'] }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: NGO_NOT_FOUND
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  # ───────────────────────── Módulo 2 — Vitrine & Doações ─────────────────────────
  /items:
    post:
      tags: [Items]
      summary: Publicar item com exatamente 3 fotos (DONOR)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [title, category, photos]
              properties:
                title: { type: string, minLength: 3, maxLength: 255 }
                description: { type: string, maxLength: 2000 }
                notes: { type: string, maxLength: 1000, description: 'Observações do doador (retirada, conservação…). Opcional' }
                category: { $ref: '#/components/schemas/Category' }
                city: { type: string, minLength: 2, maxLength: 100, description: 'Default: cidade do doador' }
                state: { $ref: '#/components/schemas/UF' }
                photos:
                  type: array
                  minItems: 3
                  maxItems: 3
                  items: { type: string, format: binary }
            encoding:
              photos: { contentType: 'image/jpeg, image/png, image/webp' }
      responses:
        '201':
          description: Item criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Item' }
        '400':
          description: INVALID_PHOTO_COUNT, INVALID_PHOTO ou VALIDATION_ERROR
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: INVALID_PHOTO_COUNT, message: 'É obrigatório enviar exatamente 3 fotos do item.' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413':
          description: PAYLOAD_TOO_LARGE
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /items/feed:
    get:
      tags: [Items]
      summary: Feed da cidade/UF do usuário logado
      description: Acesso DONOR e NGO. Itens DISPONIVEL e EM_PROGRESSO, mais novos primeiro.
      parameters:
        - { name: category, in: query, schema: { $ref: '#/components/schemas/Category' } }
        - { name: search, in: query, schema: { type: string, minLength: 1, maxLength: 100 } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Lista paginada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemList' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /items/me:
    get:
      tags: [Items]
      summary: Minhas doações (DONOR) ou meus interesses (NGO)
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ItemStatus' } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Lista paginada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemList' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /items/{itemId}:
    parameters:
      - $ref: '#/components/parameters/ItemId'
    get:
      tags: [Items]
      summary: Detalhe do item
      responses:
        '200':
          description: Item com contexto do usuário
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemDetail' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ItemNotFound' }

  # ───────────────────────── Módulo 3 — Match Invertido ─────────────────────────
  /items/{itemId}/interest:
    parameters:
      - $ref: '#/components/parameters/ItemId'
    post:
      tags: [Interests]
      summary: Demonstrar interesse (like)
      description: Acesso NGO com status ATIVO. Item DISPONIVEL da mesma cidade/UF.
      responses:
        '201':
          description: Interesse registrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Interest' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: FORBIDDEN, NGO_NOT_APPROVED ou OUT_OF_REGION
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404': { $ref: '#/components/responses/ItemNotFound' }
        '409':
          description: ALREADY_INTERESTED ou ITEM_NOT_AVAILABLE
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    delete:
      tags: [Interests]
      summary: Desfazer interesse
      description: Acesso NGO que deu o like. Bloqueado se a ONG já foi selecionada.
      responses:
        '204': { description: Interesse removido }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: INTEREST_NOT_FOUND
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409':
          description: ALREADY_SELECTED
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /items/{itemId}/interests:
    parameters:
      - $ref: '#/components/parameters/ItemId'
    get:
      tags: [Interests]
      summary: Listar ONGs interessadas
      description: Acesso DONOR dono do item. ONGs ATIVO primeiro, depois por data do like.
      responses:
        '200':
          description: Lista de interessadas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InterestList' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ItemNotFound' }

  /items/{itemId}/select-ngo:
    parameters:
      - $ref: '#/components/parameters/ItemId'
    post:
      tags: [Interests]
      summary: Escolher ONG e abrir chat (DISPONIVEL → EM_PROGRESSO)
      description: Acesso DONOR dono do item.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ngo_id]
              properties:
                ngo_id: { type: string, format: uuid }
      responses:
        '200':
          description: Negociação aberta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Selection' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ItemNotFound' }
        '409':
          description: ITEM_NOT_AVAILABLE, NGO_NOT_INTERESTED, NGO_NOT_ACTIVE, ITEM_UNDER_REVIEW ou ITEM_REMOVED
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  # ───────────────────────── Módulo 4 — Chat, Encerramento & Denúncias ─────────────────────────
  /chats:
    get:
      tags: [Chats]
      summary: Listar minhas conversas
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [EM_PROGRESSO, DOADO] } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Conversas por atividade mais recente
          content:
            application/json:
              schema:
                type: object
                required: [total, data]
                properties:
                  total: { type: integer, minimum: 0 }
                  data: { type: array, items: { $ref: '#/components/schemas/ChatSummary' } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /chats/unread:
    get:
      tags: [Chats]
      summary: Total de mensagens não lidas (V1.1)
      description: |
        Para o badge do app. Conta as mensagens recebidas da outra parte da negociação atual, em conversas
        EM_PROGRESSO e DOADO, depois da última leitura. Em tempo real, o WebSocket envia o evento `unread.updated`.
      responses:
        '200':
          description: Totais de não lidas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UnreadSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /chats/{itemId}/read:
    parameters:
      - $ref: '#/components/parameters/ItemId'
    post:
      tags: [Chats]
      summary: Marcar a conversa como lida (V1.1)
      description: |
        Marca como lidas todas as mensagens recebidas até agora nesta conversa e devolve os totais atualizados.
        Enviar uma mensagem também marca a conversa como lida para quem enviou. Mesmas regras de acesso da leitura
        da sala (item DOADO permitido).
      responses:
        '200':
          description: Conversa lida; totais atualizados
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UnreadSummary' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ItemNotFound' }
        '409': { $ref: '#/components/responses/ChatClosed' }

  /chats/{itemId}/messages:
    parameters:
      - $ref: '#/components/parameters/ItemId'
    get:
      tags: [Chats]
      summary: Histórico da sala (e polling com ?after)
      parameters:
        - { name: after, in: query, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: Estado do item e mensagens
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatRoom' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ItemNotFound' }
        '409': { $ref: '#/components/responses/ChatClosed' }
    post:
      tags: [Chats]
      summary: Enviar mensagem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        '201':
          description: Mensagem gravada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ItemNotFound' }
        '409': { $ref: '#/components/responses/ChatClosed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /items/{itemId}/confirm-receipt:
    parameters:
      - $ref: '#/components/parameters/ItemId'
    post:
      tags: [Chats]
      summary: Confirmar recebimento (EM_PROGRESSO → DOADO)
      description: Acesso NGO selecionada com status ATIVO.
      responses:
        '200':
          description: Doação concluída
          content:
            application/json:
              schema:
                type: object
                required: [item_id, status, completed_at]
                properties:
                  item_id: { type: string, format: uuid }
                  status: { type: string, const: DOADO }
                  completed_at: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: FORBIDDEN ou NGO_NOT_APPROVED
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404': { $ref: '#/components/responses/ItemNotFound' }
        '409': { $ref: '#/components/responses/NotInProgress' }

  /items/{itemId}/cancel:
    parameters:
      - $ref: '#/components/parameters/ItemId'
    post:
      tags: [Chats]
      summary: Cancelar negociação (EM_PROGRESSO → DISPONIVEL)
      description: Acesso dono do item ou NGO selecionada.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Item de volta à vitrine
          content:
            application/json:
              schema:
                type: object
                required: [item_id, previous_status, current_status, cancelled_by, message]
                properties:
                  item_id: { type: string, format: uuid }
                  previous_status: { type: string, const: EM_PROGRESSO }
                  current_status: { type: string, const: DISPONIVEL }
                  cancelled_by: { type: string, enum: [DONOR, NGO] }
                  message: { type: string }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ItemNotFound' }
        '409': { $ref: '#/components/responses/NotInProgress' }

  /chats/{itemId}/report:
    parameters:
      - $ref: '#/components/parameters/ItemId'
    post:
      tags: [Reports]
      summary: Denunciar a outra parte da negociação
      description: |
        Só quem participa da negociação atual (doador ou ONG escolhida), com o item EM_PROGRESSO ou DOADO;
        a denunciada é sempre a outra parte. Uma denúncia aberta por usuário e item. Limite: 5 por minuto, por usuário.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 10, maxLength: 1000 }
      responses:
        '201':
          description: Denúncia aberta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Report' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ItemNotFound' }
        '409':
          description: ALREADY_REPORTED, ou CHAT_CLOSED (item DISPONIVEL, sem negociação a denunciar)
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /items/{itemId}/report:
    parameters:
      - $ref: '#/components/parameters/ItemId'
    post:
      tags: [Reports]
      summary: Denunciar o conteúdo de um anúncio
      description: |
        Qualquer DONOR ou NGO logado (de qualquer status), menos o dono do item. Anúncio removido, ou oculto para
        quem não é da negociação, responde 404. Uma denúncia de anúncio aberta por usuário e item.
        Com 3 pessoas diferentes com denúncia aberta, o anúncio fica OCULTO (sai do feed e das listas) até o Admin decidir.
        Limite: 5 por minuto, por usuário.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category]
              properties:
                category: { $ref: '#/components/schemas/ReportCategory' }
                reason:
                  type: string
                  maxLength: 1000
                  description: Opcional; obrigatório (mínimo de 10 caracteres) na categoria OUTRO
      responses:
        '201':
          description: Denúncia aberta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Report' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: FORBIDDEN (Admin, ou o dono do item)
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404': { $ref: '#/components/responses/ItemNotFound' }
        '409':
          description: ITEM_ALREADY_REPORTED
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /admin/reports:
    get:
      tags: [Reports]
      summary: Fila de denúncias (ADMIN)
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [ABERTA, RESOLVIDA], default: ABERTA } }
        - { name: kind, in: query, description: 'Sem o filtro, os dois tipos', schema: { $ref: '#/components/schemas/ReportKind' } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Denúncias, mais antigas primeiro
          content:
            application/json:
              schema:
                type: object
                required: [total, data]
                properties:
                  total: { type: integer, minimum: 0 }
                  data: { type: array, items: { $ref: '#/components/schemas/ReportSummary' } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/reports/{reportId}:
    parameters:
      - { name: reportId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Reports]
      summary: Denúncia com o contexto do item (ADMIN)
      responses:
        '200':
          description: |
            Denúncia, partes, fotos, denúncias de anúncio do item e eventos. Todas as mensagens do item vêm só
            nas denúncias de negociação (`CHAT`); nas de anúncio, `messages` é vazio.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportDetail' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ReportNotFound' }
    patch:
      tags: [Reports]
      summary: Resolver denúncia (ADMIN)
      description: |
        Idempotente — resolver uma denúncia já resolvida devolve 200 com ela como está.
        Denúncia de anúncio aberta responde 409 CONFLICT: use /admin/items/{itemId}/remove ou /restore.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, const: RESOLVIDA }
      responses:
        '200':
          description: Denúncia resolvida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Report' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ReportNotFound' }
        '409':
          description: CONFLICT (denúncia de anúncio aberta)
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /admin/items/{itemId}/remove:
    parameters:
      - $ref: '#/components/parameters/ItemId'
    post:
      tags: [Reports]
      summary: Remover anúncio pela moderação (ADMIN)
      description: |
        O anúncio sai do ar de vez (`moderation_status: REMOVIDO`) e o doador vê o motivo em "Minhas doações".
        Item EM_PROGRESSO: a negociação é cancelada (volta a DISPONIVEL, eventos EM_PROGRESSO → CANCELADO →
        DISPONIVEL com o Admin como autor; as partes recebem `item.status_changed` no WebSocket).
        As denúncias de anúncio abertas do item ficam RESOLVIDA com `resolution: ITEM_REMOVIDO`.
        Idempotente: remover de novo não muda o motivo nem cancela nada.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 10, maxLength: 500, description: 'Mostrado ao doador' }
      responses:
        '200':
          description: Anúncio removido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModerationResult' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ItemNotFound' }

  /admin/items/{itemId}/restore:
    parameters:
      - $ref: '#/components/parameters/ItemId'
    post:
      tags: [Reports]
      summary: Manter (ou republicar) anúncio (ADMIN)
      description: |
        O anúncio volta a VISIVEL e as denúncias de anúncio abertas ficam RESOLVIDA com `resolution: IMPROCEDENTE`.
        Também desfaz uma remoção por engano (a negociação cancelada não volta).
      responses:
        '200':
          description: Anúncio no ar
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModerationResult' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ItemNotFound' }

  # ───────────────────────── Perfil ─────────────────────────
  /profile:
    patch:
      tags: [Profile]
      summary: Editar nome, cidade/UF e descrição; ONG também site, contato, categorias aceitas e endereço
      description: |
        Só os campos enviados mudam. `null` (ou texto vazio) apaga. Campos marcados "Só ONG" enviados por um
        doador geram `400 VALIDATION_ERROR`, com um item em `details` por campo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { type: string, minLength: 2, maxLength: 255 }
                city: { type: string, minLength: 2, maxLength: 100 }
                state: { $ref: '#/components/schemas/UF' }
                bio: { type: [string, 'null'], maxLength: 500, description: 'Descrição da página pessoal; null apaga' }
                website: { type: [string, 'null'], format: uri, description: 'Só ONG; null apaga' }
                phone:
                  type: [string, 'null']
                  description: 'Só ONG. Com ou sem máscara; a API guarda só os dígitos com DDD (10 ou 11). null apaga'
                  examples: ['(11) 98765-4321']
                instagram:
                  type: [string, 'null']
                  description: 'Só ONG. Aceita "ong", "@ong" ou a URL do perfil; a API guarda só o usuário. null apaga'
                accepted_categories:
                  type: array
                  maxItems: 4
                  items: { $ref: '#/components/schemas/Category' }
                  description: 'Só ONG. Categorias que a ONG aceita; repetições são ignoradas'
                address:
                  description: 'Só ONG. Endereço completo (complemento opcional) ou null para apagar'
                  oneOf:
                    - type: 'null'
                    - type: object
                      required: [cep, street, number, neighborhood]
                      properties:
                        cep: { type: string, description: '8 dígitos, com ou sem hífen', examples: ['01310-100'] }
                        street: { type: string, minLength: 2, maxLength: 200 }
                        number: { type: string, minLength: 1, maxLength: 20 }
                        complement: { type: string, maxLength: 100 }
                        neighborhood: { type: string, minLength: 2, maxLength: 100 }
              dependentRequired:
                city: [state]
                state: [city]
      responses:
        '200':
          description: Perfil atualizado
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Profile]
      summary: Excluir a conta (anonimização; apaga o cookie de sessão)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, minLength: 1 }
      responses:
        '204': { description: Conta removida }
        '400':
          description: INVALID_CURRENT_PASSWORD ou VALIDATION_ERROR
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: HAS_ACTIVE_NEGOTIATIONS
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /profile/avatar:
    put:
      tags: [Profile]
      summary: Enviar foto de perfil (DONOR e NGO)
      description: |
        multipart/form-data com **1 arquivo** no campo `avatar` (JPG, PNG ou WEBP, até 5 MB; o tipo é conferido
        pelo conteúdo). A API corta ao centro na proporção certa e grava WEBP 512×512. A imagem anterior é apagada.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [avatar]
              properties:
                avatar: { type: string, format: binary }
      responses:
        '200':
          description: Imagem trocada
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '400':
          description: INVALID_PHOTO (tipo inválido, nenhum arquivo no campo `avatar` ou mais de um)
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413':
          description: PAYLOAD_TOO_LARGE (arquivo acima de 5 MB)
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    delete:
      tags: [Profile]
      summary: Remover foto de perfil (DONOR e NGO; idempotente)
      responses:
        '200':
          description: Imagem removida
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /profile/banner:
    put:
      tags: [Profile]
      summary: Enviar banner da ONG (só NGO)
      description: |
        multipart/form-data com **1 arquivo** no campo `banner` (JPG, PNG ou WEBP, até 5 MB; o tipo é conferido
        pelo conteúdo). A API corta ao centro na proporção certa e grava WEBP 1500×500. A imagem anterior é apagada.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [banner]
              properties:
                banner: { type: string, format: binary }
      responses:
        '200':
          description: Imagem trocada
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '400':
          description: INVALID_PHOTO (tipo inválido, nenhum arquivo no campo `banner` ou mais de um)
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413':
          description: PAYLOAD_TOO_LARGE (arquivo acima de 5 MB)
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    delete:
      tags: [Profile]
      summary: Remover banner da ONG (só NGO; idempotente)
      responses:
        '200':
          description: Imagem removida
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /profile/preferences:
    get:
      tags: [Profile]
      summary: Preferências de tema e privacidade
      description: Quem nunca alterou recebe os padrões (AZUL, SYSTEM, show_donations false). Também vêm em `user.preferences`.
      responses:
        '200':
          description: Preferências atuais
          content: { application/json: { schema: { $ref: '#/components/schemas/Preferences' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Profile]
      summary: Alterar cor do tema, modo claro/escuro e (doador) mostrar doações
      description: |
        Parcial: só o que vier muda. Vale para DONOR, NGO e ADMIN. `show_donations` é só do doador:
        enviado por ONG ou Admin gera `400 VALIDATION_ERROR` no campo `show_donations`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                theme_color: { $ref: '#/components/schemas/ThemeColor' }
                theme_mode: { $ref: '#/components/schemas/ThemeMode' }
                show_donations: { type: boolean }
      responses:
        '200':
          description: Preferências atualizadas
          content: { application/json: { schema: { $ref: '#/components/schemas/Preferences' } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfHeaderMissing' }

  /profile/password:
    patch:
      tags: [Profile]
      summary: Trocar senha (encerra as outras sessões e renova o cookie desta)
      description: |
        Tokens emitidos antes da troca deixam de valer em todos os aparelhos. A resposta traz um `Set-Cookie`
        novo para a sessão atual, que continua logada.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string, minLength: 1 }
                new_password: { type: string, minLength: 8, maxLength: 72 }
      responses:
        '204': { description: Senha alterada }
        '400':
          description: INVALID_CURRENT_PASSWORD, SAME_PASSWORD ou VALIDATION_ERROR
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfHeaderMissing' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /profile/ngo-document:
    put:
      tags: [Profile]
      summary: Reenviar documento da ONG (volta para PENDENTE_APROVACAO)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [document]
              properties:
                document: { type: string, format: binary, description: 'PDF, JPG, PNG ou WEBP até 5 MB' }
      responses:
        '200':
          description: Documento reenviado
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '400':
          description: INVALID_DOCUMENT
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: NGO_ALREADY_ACTIVE
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  # ───────────────────────── Página pessoal e visitante ─────────────────────────
  /users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Users]
      summary: Página pessoal de um doador ou ONG
      description: |
        Doador: nome abreviado ("Marina S."); `donations_count` é null se ele escolheu não mostrar as doações
        (exceto para ele mesmo). ONG: nome completo e o bloco `ngo`; telefone, Instagram e endereço só
        vêm quando a ONG está ATIVO (ou para ela mesma). Admin e conta excluída: 404 USER_NOT_FOUND.
      responses:
        '200':
          description: Página pessoal
          content: { application/json: { schema: { $ref: '#/components/schemas/UserProfile' } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/UserNotFound' }

  /users/{userId}/donations:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Users]
      summary: Doações concluídas do doador ou recebidas pela ONG
      description: |
        Doador com as doações ocultas (e quem pede não é ele): `{ total: 0, data: [], hidden: true }`,
        sem revelar se existem doações. Itens DOADO, dos mais recentes para os mais antigos.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Lista paginada
          content: { application/json: { schema: { $ref: '#/components/schemas/UserDonations' } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/UserNotFound' }

  /public/items:
    get:
      tags: [Public]
      summary: Feed para visitante (todas as cidades)
      description: Itens DISPONIVEL e EM_PROGRESSO de todas as cidades, mais novos primeiro.
      security: []
      parameters:
        - { name: category, in: query, schema: { $ref: '#/components/schemas/Category' } }
        - { name: search, in: query, schema: { type: string, minLength: 1, maxLength: 100 } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Lista paginada
          content: { application/json: { schema: { $ref: '#/components/schemas/PublicItemList' } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /public/items/{itemId}:
    parameters:
      - $ref: '#/components/parameters/ItemId'
    get:
      tags: [Public]
      summary: Detalhe para visitante
      description: Só itens que estão no feed (DISPONIVEL ou EM_PROGRESSO). DOADO ou inexistente → 404.
      security: []
      responses:
        '200':
          description: Item
          content: { application/json: { schema: { $ref: '#/components/schemas/PublicItem' } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/ItemNotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /public/users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Public]
      summary: Página pessoal para visitante
      description: |
        Sem nome, foto, banner, endereço nem contatos. Só doadores e ONGs ATIVO; ONG pendente ou rejeitada,
        Admin e conta excluída → 404 USER_NOT_FOUND.
      security: []
      responses:
        '200':
          description: Perfil público
          content: { application/json: { schema: { $ref: '#/components/schemas/PublicUser' } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/UserNotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ───────────────────────── Health (fora de /api/v1) ─────────────────────────
  /health:
    servers:
      - url: http://localhost:3333
      - url: https://<api>
    get:
      tags: [Health]
      summary: Liveness — o processo está vivo
      security: []
      responses:
        '200':
          description: Processo respondendo
          content:
            application/json:
              schema:
                type: object
                required: [status, version, uptime_s]
                properties:
                  status: { type: string, const: ok }
                  version: { type: string }
                  uptime_s: { type: integer, minimum: 0 }

  /health/ready:
    servers:
      - url: http://localhost:3333
      - url: https://<api>
    get:
      tags: [Health]
      summary: Readiness — banco respondendo em até 2 s
      security: []
      responses:
        '200':
          description: Pronto para receber tráfego
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
        '503':
          description: Banco indisponível
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: cd_session
      description: JWT em cookie httpOnly gravado pelo login/cadastro (ADR-13). Não é lido pelo JS do navegador.

  parameters:
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 30 } }
    Offset: { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
    ItemId: { name: itemId, in: path, required: true, schema: { type: string, format: uuid } }
    UserId: { name: userId, in: path, required: true, schema: { type: string, format: uuid } }

  responses:
    Unauthorized:
      description: UNAUTHORIZED
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: FORBIDDEN (ou CSRF_HEADER_MISSING, se faltar o header X-Requested-With)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    CsrfHeaderMissing:
      description: CSRF_HEADER_MISSING (falta o header X-Requested-With)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    ValidationError:
      description: VALIDATION_ERROR
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    TooManyRequests:
      description: TOO_MANY_REQUESTS
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    ItemNotFound:
      description: ITEM_NOT_FOUND
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    ChatClosed:
      description: CHAT_CLOSED
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotInProgress:
      description: ITEM_NOT_IN_PROGRESS
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    UserNotFound:
      description: USER_NOT_FOUND (Admin, conta excluída, inexistente ou, no público, ONG não ATIVO)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    ReportNotFound:
      description: REPORT_NOT_FOUND
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  schemas:
    # ── Comuns ──
    Error:
      type: object
      required: [error, message]
      properties:
        error: { type: string }
        message: { type: string }
        details:
          type: array
          items:
            type: object
            properties:
              path: { type: string }
              message: { type: string }

    UF:
      type: string
      enum: [AC, AL, AP, AM, BA, CE, DF, ES, GO, MA, MT, MS, MG, PA, PB, PR, PE, PI, RJ, RN, RS, RO, RR, SC, SP, SE, TO]
    Role: { type: string, enum: [DONOR, NGO, ADMIN] }
    NgoStatus: { type: string, enum: [PENDENTE_APROVACAO, ATIVO, REJEITADO] }
    Category: { type: string, enum: [ROUPAS, BRINQUEDOS, ALIMENTOS, LIVROS] }
    ItemStatus: { type: string, enum: [DISPONIVEL, EM_PROGRESSO, DOADO] }
    ModerationStatus:
      type: string
      enum: [VISIVEL, OCULTO, REMOVIDO]
      description: |
        Moderação do anúncio, independente do status da doação. OCULTO: saiu do ar sozinho por denúncias e
        aguarda o Admin. REMOVIDO: o Admin tirou do ar. Fora de VISIVEL, o item some do feed, das rotas públicas,
        da página pessoal e das listas das ONGs (salvo da ONG escolhida); o detalhe só abre para o doador,
        a ONG escolhida e o Admin. Curtir responde 404; escolher ONG, 409 ITEM_UNDER_REVIEW ou ITEM_REMOVED.
    ReportKind: { type: string, enum: [CHAT, ITEM] }
    ReportCategory:
      type: string
      enum: [NUDEZ, ODIO, VIOLENCIA, GOLPE, PROIBIDO, SPAM, OUTRO]
      description: |
        Denúncia de anúncio. NUDEZ: nudez ou conteúdo sexual. ODIO: discurso de ódio ou discriminação.
        VIOLENCIA: violência ou conteúdo chocante. GOLPE: golpe, fraude ou cobrança. PROIBIDO: item proibido
        (armas, drogas, medicamentos, animais). SPAM: não é doação ou é propaganda. OUTRO: descrever em `reason`.
    ReportResolution:
      type: [string, 'null']
      enum: [ITEM_REMOVIDO, IMPROCEDENTE, null]
      description: Desfecho da moderação de anúncio; null nas denúncias de negociação e nas abertas

    Readiness:
      type: object
      required: [status, version, checks]
      properties:
        status: { type: string, enum: [ok, error] }
        version: { type: string }
        checks:
          type: object
          properties:
            database:
              type: object
              properties:
                status: { type: string, enum: [ok, error] }
                latency_ms: { type: integer, minimum: 0 }
                error: { type: string }

    # ── Módulo 1 ──
    Address:
      type: object
      required: [cep, street, number, complement, neighborhood]
      properties:
        cep: { type: string, pattern: '^[0-9]{8}$', examples: ['01310100'] }
        street: { type: string }
        number: { type: string }
        complement: { type: [string, 'null'] }
        neighborhood: { type: string }

    NgoProfile:
      type: object
      required: [id, cnpj, website, status, rejection_reason, banner_url, phone, instagram, accepted_categories, address]
      properties:
        id: { type: string, format: uuid }
        cnpj: { type: string, examples: ['12.345.678/0001-99'] }
        website: { type: [string, 'null'], format: uri }
        status: { $ref: '#/components/schemas/NgoStatus' }
        rejection_reason: { type: [string, 'null'] }
        banner_url: { type: [string, 'null'], format: uri, description: 'Banner 1500×500 (WEBP); null = sem banner' }
        phone: { type: [string, 'null'], pattern: '^[1-9][0-9]{9,10}$', description: 'Só dígitos, com DDD', examples: ['11987654321'] }
        instagram: { type: [string, 'null'], description: 'Usuário, sem @', examples: ['ongsalvadora'] }
        accepted_categories: { type: array, items: { $ref: '#/components/schemas/Category' } }
        address:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/Address'

    ThemeColor: { type: string, enum: [AZUL, VERDE, ROXO, LARANJA, ROSA] }
    ThemeMode: { type: string, enum: [LIGHT, DARK, SYSTEM], description: 'SYSTEM segue o prefers-color-scheme do aparelho' }

    Preferences:
      type: object
      required: [theme_color, theme_mode, show_donations]
      properties:
        theme_color: { $ref: '#/components/schemas/ThemeColor' }
        theme_mode: { $ref: '#/components/schemas/ThemeMode' }
        show_donations: { type: boolean, description: 'Doador: mostrar as doações concluídas na página pessoal. Sempre false para ONG e Admin' }

    User:
      type: object
      required: [id, name, email, role, city, state, bio, avatar_url, preferences]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
        city: { type: string }
        state: { $ref: '#/components/schemas/UF' }
        bio: { type: [string, 'null'], description: 'Descrição da página pessoal' }
        avatar_url: { type: [string, 'null'], format: uri, description: 'Foto de perfil 512×512 (WEBP); null = mostrar as iniciais' }
        preferences: { $ref: '#/components/schemas/Preferences' }
        ngo_profile: { $ref: '#/components/schemas/NgoProfile' }

    AuthResponse:
      type: object
      description: O token não vem no corpo; ele vai no cookie httpOnly `cd_session` (header Set-Cookie).
      required: [user]
      properties:
        user: { $ref: '#/components/schemas/User' }

    AdminNgo:
      type: object
      properties:
        ngo_profile_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        city: { type: string }
        state: { $ref: '#/components/schemas/UF' }
        cnpj: { type: string }
        website: { type: [string, 'null'], format: uri }
        document_url: { type: string, format: uri, description: 'URL assinada, expira em 10 minutos' }
        status: { $ref: '#/components/schemas/NgoStatus' }
        rejection_reason: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }

    # ── Módulo 2 ──
    Photo:
      type: object
      required: [id, photo_url]
      properties:
        id: { type: string, format: uuid }
        photo_url: { type: string, format: uri }

    Item:
      type: object
      required: [id, donor_id, title, notes, category, city, state, status, photos, created_at, moderation_status, moderation_reason]
      properties:
        id: { type: string, format: uuid }
        donor_id: { type: string, format: uuid }
        title: { type: string }
        description: { type: [string, 'null'] }
        notes: { type: [string, 'null'], description: 'Observações do doador. Não aparece no FeedItem' }
        category: { $ref: '#/components/schemas/Category' }
        city: { type: string }
        state: { type: string }
        status: { $ref: '#/components/schemas/ItemStatus' }
        selected_ngo_id: { type: [string, 'null'], format: uuid }
        photos: { type: array, minItems: 3, maxItems: 3, items: { $ref: '#/components/schemas/Photo' } }
        created_at: { type: string, format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }
        moderation_status: { $ref: '#/components/schemas/ModerationStatus' }
        moderation_reason: { type: [string, 'null'], description: 'Motivo da remoção; só para o doador (null para os demais)' }

    Donor:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string, examples: ['Marina S.'] }
        avatar_url: { type: [string, 'null'], format: uri, description: 'Foto de perfil; null = iniciais' }

    FeedItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: [string, 'null'] }
        category: { $ref: '#/components/schemas/Category' }
        city: { type: string }
        state: { type: string }
        status: { $ref: '#/components/schemas/ItemStatus' }
        has_user_interest: { type: boolean }
        interests_count: { type: integer, minimum: 0 }
        is_selected: { type: boolean }
        created_at: { type: string, format: date-time }
        donor: { $ref: '#/components/schemas/Donor' }
        photos: { type: array, minItems: 3, maxItems: 3, items: { type: string, format: uri } }
        moderation_status: { $ref: '#/components/schemas/ModerationStatus' }
        moderation_reason: { type: [string, 'null'], description: 'Motivo da remoção; só para o doador (null para os demais)' }

    ItemDetail:
      allOf:
        - $ref: '#/components/schemas/Item'
        - type: object
          properties:
            donor: { $ref: '#/components/schemas/Donor' }
            has_user_interest: { type: boolean }
            interests_count: { type: integer, minimum: 0 }
            is_selected: { type: boolean }

    ItemList:
      type: object
      required: [total, data]
      properties:
        total: { type: integer, minimum: 0 }
        data: { type: array, items: { $ref: '#/components/schemas/FeedItem' } }

    # ── Módulo 3 ──
    Interest:
      type: object
      required: [id, item_id, ngo_id, created_at]
      properties:
        id: { type: string, format: uuid }
        item_id: { type: string, format: uuid }
        ngo_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }

    InterestedNgo:
      type: object
      required: [interest_id, ngo_id, name, city, state, cnpj, ngo_status, liked_at]
      properties:
        interest_id: { type: string, format: uuid }
        ngo_id: { type: string, format: uuid }
        name: { type: string }
        avatar_url: { type: [string, 'null'], format: uri }
        city: { type: string }
        state: { type: string }
        cnpj: { type: string, examples: ['12.345.678/0001-99'] }
        website: { type: [string, 'null'], format: uri }
        ngo_status: { $ref: '#/components/schemas/NgoStatus' }
        liked_at: { type: string, format: date-time }

    InterestList:
      type: object
      required: [item_id, total, interested_ngos]
      properties:
        item_id: { type: string, format: uuid }
        total: { type: integer, minimum: 0 }
        interested_ngos: { type: array, items: { $ref: '#/components/schemas/InterestedNgo' } }

    Selection:
      type: object
      required: [item_id, status, selected_ngo_id, chat_room_url]
      properties:
        item_id: { type: string, format: uuid }
        status: { type: string, const: EM_PROGRESSO }
        selected_ngo_id: { type: string, format: uuid }
        chat_room_url: { type: string, examples: ['/chats/aa0e8400-e29b-41d4-a716-446655440333'] }

    # ── Módulo 4 ──
    Counterpart:
      type: object
      required: [id, name, role]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        role: { type: string, enum: [DONOR, NGO] }
        avatar_url: { type: [string, 'null'], format: uri, description: 'Vem na lista de conversas e na sala (não nas denúncias)' }

    ChatSummary:
      type: object
      required: [item_id, item_title, item_photo, item_status, counterpart, last_message, unread_count]
      properties:
        item_id: { type: string, format: uuid }
        item_title: { type: string }
        item_photo: { type: string, format: uri }
        item_status: { type: string, enum: [EM_PROGRESSO, DOADO] }
        counterpart: { $ref: '#/components/schemas/Counterpart' }
        last_message:
          oneOf:
            - type: 'null'
            - type: object
              properties:
                message: { type: string }
                sender_id: { type: string, format: uuid }
                created_at: { type: string, format: date-time }
        unread_count:
          type: integer
          minimum: 0
          description: Mensagens recebidas da outra parte depois da última leitura (V1.1)

    UnreadSummary:
      type: object
      required: [unread_messages, unread_chats]
      properties:
        unread_messages: { type: integer, minimum: 0, description: Total de mensagens não lidas }
        unread_chats: { type: integer, minimum: 0, description: Conversas com ao menos uma não lida }

    Message:
      type: object
      required: [id, item_id, sender_id, receiver_id, message, created_at]
      properties:
        id: { type: string, format: uuid }
        item_id: { type: string, format: uuid }
        sender_id: { type: string, format: uuid }
        receiver_id: { type: string, format: uuid }
        message: { type: string }
        created_at: { type: string, format: date-time }

    ChatRoom:
      type: object
      required: [item, counterpart, messages]
      properties:
        item:
          type: object
          properties:
            id: { type: string, format: uuid }
            title: { type: string }
            status: { type: string, enum: [EM_PROGRESSO, DOADO] }
            donor_id: { type: string, format: uuid }
            selected_ngo_id: { type: [string, 'null'], format: uuid }
        counterpart: { $ref: '#/components/schemas/Counterpart' }
        messages: { type: array, items: { $ref: '#/components/schemas/Message' } }

    Report:
      type: object
      required: [id, item_id, reporter_id, reported_id, kind, category, reason, status, resolution, created_at]
      properties:
        id: { type: string, format: uuid }
        item_id: { type: string, format: uuid }
        reporter_id: { type: string, format: uuid }
        reported_id: { type: string, format: uuid, description: 'Na denúncia de anúncio, o doador do item' }
        kind: { $ref: '#/components/schemas/ReportKind' }
        category:
          description: Só nas denúncias de anúncio
          oneOf:
            - $ref: '#/components/schemas/ReportCategory'
            - type: 'null'
        reason: { type: [string, 'null'], description: 'Sempre na de negociação; opcional na de anúncio' }
        status: { type: string, enum: [ABERTA, RESOLVIDA] }
        resolution: { $ref: '#/components/schemas/ReportResolution' }
        created_at: { type: string, format: date-time }

    ReportSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/ReportKind' }
        category:
          oneOf:
            - $ref: '#/components/schemas/ReportCategory'
            - type: 'null'
        status: { type: string, enum: [ABERTA, RESOLVIDA] }
        resolution: { $ref: '#/components/schemas/ReportResolution' }
        reason: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        item:
          type: object
          properties:
            id: { type: string, format: uuid }
            title: { type: string }
            status: { $ref: '#/components/schemas/ItemStatus' }
            moderation_status: { $ref: '#/components/schemas/ModerationStatus' }
        reporter: { $ref: '#/components/schemas/Counterpart' }
        reported: { $ref: '#/components/schemas/Counterpart' }

    ReportDetail:
      type: object
      properties:
        report:
          type: object
          properties:
            id: { type: string, format: uuid }
            kind: { $ref: '#/components/schemas/ReportKind' }
            category:
              oneOf:
                - $ref: '#/components/schemas/ReportCategory'
                - type: 'null'
            status: { type: string, enum: [ABERTA, RESOLVIDA] }
            resolution: { $ref: '#/components/schemas/ReportResolution' }
            reason: { type: [string, 'null'] }
            created_at: { type: string, format: date-time }
        item:
          type: object
          properties:
            id: { type: string, format: uuid }
            title: { type: string }
            description: { type: [string, 'null'] }
            status: { $ref: '#/components/schemas/ItemStatus' }
            donor_id: { type: string, format: uuid }
            selected_ngo_id: { type: [string, 'null'], format: uuid }
            photos: { type: array, items: { type: string, format: uri } }
            moderation_status: { $ref: '#/components/schemas/ModerationStatus' }
            moderation_reason: { type: [string, 'null'] }
        reporter:
          allOf:
            - $ref: '#/components/schemas/Counterpart'
            - type: object
              properties:
                email: { type: string, format: email }
        reported:
          allOf:
            - $ref: '#/components/schemas/Counterpart'
            - type: object
              properties:
                email: { type: string, format: email }
                ngo_profile_id: { type: [string, 'null'], format: uuid }
        item_reports:
          type: array
          description: Todas as denúncias de anúncio do item (abertas e resolvidas), mais antigas primeiro
          items:
            type: object
            required: [id, category, reason, status, created_at, reporter]
            properties:
              id: { type: string, format: uuid }
              category: { $ref: '#/components/schemas/ReportCategory' }
              reason: { type: [string, 'null'] }
              status: { type: string, enum: [ABERTA, RESOLVIDA] }
              created_at: { type: string, format: date-time }
              reporter: { $ref: '#/components/schemas/Counterpart' }
        events:
          type: array
          items:
            type: object
            properties:
              from_status: { type: [string, 'null'] }
              to_status: { type: string }
              actor_id: { type: [string, 'null'], format: uuid }
              reason: { type: [string, 'null'] }
              created_at: { type: string, format: date-time }
        messages:
          type: array
          description: Só nas denúncias de negociação; vazio nas de anúncio
          items: { $ref: '#/components/schemas/Message' }

    ModerationResult:
      type: object
      required: [item_id, status, moderation_status, moderation_reason, cancelled_negotiation, resolved_reports]
      properties:
        item_id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/ItemStatus' }
        moderation_status: { $ref: '#/components/schemas/ModerationStatus' }
        moderation_reason: { type: [string, 'null'] }
        cancelled_negotiation: { type: boolean, description: 'A remoção desfez uma negociação em andamento' }
        resolved_reports: { type: integer, minimum: 0, description: 'Denúncias de anúncio abertas resolvidas por esta ação' }

    # ── Página pessoal e visitante ──
    UserProfile:
      type: object
      required: [id, role, name, avatar_url, bio, city, state, member_since, donations_count, ngo]
      properties:
        id: { type: string, format: uuid }
        role: { type: string, enum: [DONOR, NGO] }
        name: { type: string, description: 'Doador abreviado ("Marina S."); ONG com o nome completo' }
        avatar_url: { type: [string, 'null'], format: uri }
        bio: { type: [string, 'null'] }
        city: { type: string }
        state: { $ref: '#/components/schemas/UF' }
        member_since: { type: string, format: date-time }
        donations_count:
          type: [integer, 'null']
          minimum: 0
          description: Doações concluídas (doadas ou recebidas). null = doador escolheu não mostrar
        ngo:
          oneOf:
            - type: 'null'
            - type: object
              required: [status, website, banner_url, accepted_categories, phone, instagram, address]
              properties:
                status: { $ref: '#/components/schemas/NgoStatus' }
                website: { type: [string, 'null'], format: uri }
                banner_url: { type: [string, 'null'], format: uri }
                accepted_categories: { type: array, items: { $ref: '#/components/schemas/Category' } }
                phone: { type: [string, 'null'], description: 'Só de ONG ATIVO (ou para ela mesma)' }
                instagram: { type: [string, 'null'], description: 'Só de ONG ATIVO (ou para ela mesma)' }
                address:
                  description: 'Só de ONG ATIVO (ou para ela mesma)'
                  oneOf:
                    - type: 'null'
                    - $ref: '#/components/schemas/Address'

    UserDonations:
      type: object
      required: [total, data, hidden]
      properties:
        total: { type: integer, minimum: 0 }
        data: { type: array, items: { $ref: '#/components/schemas/FeedItem' } }
        hidden: { type: boolean, description: 'true = o doador escolheu não mostrar (lista sempre vazia)' }

    PublicItem:
      type: object
      additionalProperties: false
      required: [id, title, description, category, city, state, status, created_at, photos]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: [string, 'null'] }
        category: { $ref: '#/components/schemas/Category' }
        city: { type: string }
        state: { type: string }
        status: { type: string, enum: [DISPONIVEL, EM_PROGRESSO] }
        created_at: { type: string, format: date-time }
        photos: { type: array, minItems: 3, maxItems: 3, items: { type: string, format: uri } }

    PublicItemList:
      type: object
      additionalProperties: false
      required: [total, data]
      properties:
        total: { type: integer, minimum: 0 }
        data: { type: array, items: { $ref: '#/components/schemas/PublicItem' } }

    PublicUser:
      type: object
      additionalProperties: false
      required: [id, role, city, state, bio, accepted_categories, donations_count]
      properties:
        id: { type: string, format: uuid }
        role: { type: string, enum: [DONOR, NGO] }
        city: { type: string }
        state: { $ref: '#/components/schemas/UF' }
        bio: { type: [string, 'null'] }
        accepted_categories: { type: array, items: { $ref: '#/components/schemas/Category' }, description: 'Sempre [] para doador' }
        donations_count: { type: [integer, 'null'], minimum: 0 }
